# Optional external C2 settings; not loaded by the simulation launch.
# Only the existing simulation entry is offered; no separate test launch exists.
/baseline_robot/reporter_c2_serial_comm:
  ros__parameters:
    port: /dev/ttyUSB1
    baudrate: 115200
/baseline_robot/reporter_c2_udp_comm:
  ros__parameters:
    type: client
    server_ip: 192.168.0.100
    server_port: 5000
    client_ip: 192.168.0.123
    client_port: 6000
    dccl_tx_interval: 1.0
/baseline_robot/mvp_c2_reporter:
  ros__parameters:
    dccl_tx_interval: 1.0
    helm_state_list: [start, kill, survey, profiling, teleop]
    launch_packages: [baseline_robot_bringup]
    launch_files: [bringup_simulation]
