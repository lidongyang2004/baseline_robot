# Match the fixed station and noise/resolution in single_auv.scn.
# The transponder is at the vehicle Base origin (zero lever arm).
/baseline_robot/usbl_adapter:
  ros__parameters:
    world_frame: baseline_robot/world
    base_frame: baseline_robot/base_link
    station_frame: baseline_robot/usbl_station
    station_position_ned: [-10.0, -5.0, 1.0]
    station_rpy_ned: [0.0, 0.0, 0.0]
    beacon_id: 2
    sound_speed: 1531.0
    max_range: 1000.0
    range_stddev: 0.05
    horizontal_angle_stddev_deg: 0.2
    vertical_angle_stddev_deg: 0.5
    range_resolution: 0.1
    angle_resolution_deg: 0.1
    position_variance_floor: 0.01
    max_age: 2.0
    future_tolerance: 0.1
